<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>BNU-ToolBox</title>
  <defs>
    <linearGradient id="bg" x1="86" y1="44" x2="432" y2="472" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1830"/>
      <stop offset="0.58" stop-color="#123D78"/>
      <stop offset="1" stop-color="#492A9E"/>
    </linearGradient>
    <linearGradient id="mark" x1="177" y1="320" x2="338" y2="381" gradientUnits="userSpaceOnUse">
